[package]
name = "minibee-viewer"
version = "0.11.0"
description = "Minibee Viewer"
authors = ["PanteraPolnocy"]
edition = "2024"

[lib]
name = "minibee_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt-multi-thread", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip"] }
base64 = "0.23"
md-5 = "0.11"
quick-xml = "0.42"
roxmltree = "0.21"
regex = "1"
urlencoding = "2"
futures = "0.3"
once_cell = "1"
# About screen: cross-platform OS version + memory stats.
os_info = "3"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
ts-rs = "12.0.1"

# Hardware id lookup (mac/id0), per platform.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
mac_address = "1.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
wmi = "0.18"
# Reaching the WebView2 settings directly, to turn off its own right-click menu.
# Same version wry already pulls in, so this costs nothing extra to build.
webview2-com = "0.39"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "hot_paths"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

