version: 2
updates:
  # Rust dependencies (Tauri backend)
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"
      day: "saturday"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
      semver-minor-days: 3
      semver-patch-days: 2
    groups:
      tauri-core:
        patterns:
          - "tauri*"
      async-networking:
        patterns:
          - "tokio*"
          - "reqwest*"
          - "serde*"
    commit-message:
      prefix: "chore(deps-cargo)"
    labels:
      - "dependencies"
      - "rust"

  # JavaScript / Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "saturday"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
      semver-minor-days: 3
      semver-patch-days: 2
    groups:
      frontend-tooling:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps-npm)"
    labels:
      - "dependencies"
      - "javascript"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "saturday"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
    groups:
      ci-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(actions)"
    labels:
      - "dependencies"
      - "github_actions"

  # Android Build System
  - package-ecosystem: "gradle"
    directory: "/src-tauri/gen/android"
    schedule:
      interval: "monthly"
      day: "saturday"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
    groups:
      androidx-libraries:
        patterns:
          - "androidx*"
          - "com.google.android.material*"
          - "junit*"
    ignore:
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "org.jetbrains.kotlin:kotlin-gradle-plugin"
    commit-message:
      prefix: "chore(deps-android)"
    labels:
      - "dependencies"
      - "android"
