name: Regenerate mobile boilerplate (manual)

# Regenerates the Android and/or iOS project under src-tauri/gen/ and force-pushes
# the result to a throwaway branch, so nothing ever has to be merged by hand.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which project(s) to regenerate
        type: choice
        required: true
        default: both
        options: [both, android, ios]
      branch:
        description: Branch to force-push to (recreated every run)
        type: string
        required: false
        default: chore/regen-mobile-boilerplate

jobs:
  regen:
    # macOS can generate both projects; iOS tooling only exists here.
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install Rust with mobile targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android,
            aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Setup Java (Android Gradle)
        if: inputs.platform != 'ios'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK + NDK
        if: inputs.platform != 'ios'
        uses: android-actions/setup-android@v4

      - name: Install NDK
        if: inputs.platform != 'ios'
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci || npm install

      # Keep a copy of the current tree so we can show what the regeneration
      # clobbered, rather than silently losing the hand-written parts.
      - name: Snapshot existing generated projects
        run: |
          mkdir -p /tmp/gen-before
          if [ -d src-tauri/gen ]; then cp -R src-tauri/gen /tmp/gen-before/; fi

      - name: Regenerate Android project
        if: inputs.platform != 'ios'
        run: |
          rm -rf src-tauri/gen/android
          npx tauri android init

      - name: Regenerate iOS project
        if: inputs.platform != 'android'
        run: |
          rm -rf src-tauri/gen/apple
          npx tauri ios init

      - name: Report what changed in the hand-edited files
        run: |
          echo "## Hand-edited files to re-apply" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for f in \
            "src-tauri/gen/android/app/src/main/java/com/pantera/minibee_viewer/MainActivity.kt" \
            "src-tauri/gen/android/app/src/main/java/com/pantera/minibee_viewer/ConnectionService.kt" \
            "src-tauri/gen/android/app/build.gradle.kts" \
            "src-tauri/gen/apple/project.yml" \
            "src-tauri/gen/apple/minibee-viewer_iOS/Info.plist" ; do
            before="/tmp/gen-before/${f#src-tauri/}"
            before="/tmp/gen-before/gen/${f#src-tauri/gen/}"
            if [ -f "$before" ] && [ -f "$f" ]; then
              if diff -q "$before" "$f" >/dev/null; then
                echo "- \`$f\` - unchanged" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "- \`$f\` - **CHANGED, re-apply local edits**" >> "$GITHUB_STEP_SUMMARY"
                echo '```diff' >> "$GITHUB_STEP_SUMMARY"
                diff -u "$before" "$f" | head -80 >> "$GITHUB_STEP_SUMMARY" || true
                echo '```' >> "$GITHUB_STEP_SUMMARY"
              fi
            elif [ -f "$before" ]; then
              echo "- \`$f\` - **GONE after regeneration, restore it**" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Force-push to a throwaway branch
        id: push
        env:
          BRANCH: ${{ inputs.branch || 'chore/regen-mobile-boilerplate' }}
        run: |
          if git diff --quiet -- src-tauri/gen; then
            echo "Nothing changed - the generated projects already match this Tauri version."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A src-tauri/gen
          git commit -m "chore: regenerate mobile boilerplate (${{ inputs.platform }})" \
            -m "Generated by the regen-mobile-boilerplate workflow. Check the run summary for hand-edited files that need re-applying."
          # Force-push: the branch is disposable, so a regeneration never has to be merged.
          git push --force origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Link the comparison
        if: steps.push.outputs.changed == 'true'
        env:
          BRANCH: ${{ inputs.branch || 'chore/regen-mobile-boilerplate' }}
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "After re-applying hand edits, bump version only in \`src-tauri/Cargo.toml\` (sync runs automatically on build)." >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed to \`$BRANCH\`. Compare / open a PR:" >> "$GITHUB_STEP_SUMMARY"
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BRANCH?expand=1" >> "$GITHUB_STEP_SUMMARY"
