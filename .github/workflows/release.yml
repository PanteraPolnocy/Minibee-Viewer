name: Main Code Builder

# Publish a release -> full chain (desktop matrix + Android + release notes + upload).
#
# Manual run (Actions -> this workflow -> Run workflow): build ONE platform
# and expose the resulting installers as downloadable workflow artifacts.
# Nothing is uploaded to a GitHub Release or Google Play.
#
# Updater note: desktop clients fetch .../releases/latest/download/latest.json.
# GitHub only resolves /releases/latest for non-prerelease releases.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platform:
        description: Compile check (artifacts in action)
        type: choice
        required: true
        options:
          - windows
          - linux
          - macos
          - android

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      desktop_matrix: ${{ steps.plan.outputs.desktop_matrix }}
      run_android: ${{ steps.plan.outputs.run_android }}
    steps:
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          desktop_matrix='[]'
          run_android=false

          if [ "$EVENT_NAME" = "release" ]; then
            desktop_matrix='[{"platform":"macos-latest","args":"--target universal-apple-darwin"},{"platform":"ubuntu-latest","args":""},{"platform":"windows-latest","args":""}]'
            run_android=true
          else
            case "$PLATFORM" in
              windows)
                desktop_matrix='[{"platform":"windows-latest","args":""}]'
                ;;
              linux)
                desktop_matrix='[{"platform":"ubuntu-latest","args":""}]'
                ;;
              macos)
                desktop_matrix='[{"platform":"macos-latest","args":"--target universal-apple-darwin"}]'
                ;;
              android)
                run_android=true
                ;;
            esac
          fi

          echo "desktop_matrix=${desktop_matrix}" >> "$GITHUB_OUTPUT"
          echo "run_android=${run_android}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.desktop_matrix != '[]'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.desktop_matrix) }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Sync version from Cargo.toml
        run: npm run version:sync

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend/CLI dependencies
        run: npm ci

      - name: Build and upload to the release
        if: github.event_name == 'release'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ github.event.release.id }}
          args: ${{ matrix.args }}
          releaseAssetNamePattern: '[platform]_[name]_[version]_[arch][_setup][ext]'
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true

      - name: Compile check
        if: github.event_name == 'workflow_dispatch'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload compile-check installers
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-installer
          path: |
            src-tauri/target/release/bundle/**
          if-no-files-found: error

  build-android:
    needs: plan
    if: needs.plan.outputs.run_android == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      APK_PATH: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
      AAB_PATH: src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Sync version from Cargo.toml
        run: npm run version:sync

      - name: Set up Java JDK
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          # r28+ aligns native libraries to 16 KB pages by default - a Google
          # Play requirement (since Nov 2025) for apps targeting Android 15+,
          # and needed on devices that boot with 16 KB kernels.
          ndk-version: r28c
          link-to-sdk: true

      - name: Pin the NDK version for Gradle
        run: |
          NDK_VERSION="$(sed -n 's/^Pkg\.Revision *= *//p' "${{ steps.setup-ndk.outputs.ndk-path }}/source.properties" | tr -d '\r')"
          if [ -z "$NDK_VERSION" ]; then
            echo "::error::Could not read the NDK revision from source.properties"
            exit 1
          fi
          echo "MINIBEE_NDK_VERSION=${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "Gradle will use NDK ${NDK_VERSION}"

      - name: Set up Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android"

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Require Android signing secrets
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: ${name#ANDROID_}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure Android release signing
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/upload-keystore.jks
          {
            echo "password=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyPassword=${KEY_PASS}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "storeFile=upload-keystore.jks"
          } > src-tauri/gen/android/keystore.properties

      # APK for sideloading from the release page, AAB for the Google Play Console
      # (Play only accepts App Bundles for new apps). Two separate builds on
      # purpose: the Play edition is compiled with MINIBEE_PLAY_BUILD=1, which
      # removes the in-app L$ purchase (Play policy routes virtual currency
      # through its own billing, and a monetized listing publishes the
      # developer's legal address). The sideload APK keeps the full app.
      - name: Build Android APK (sideload)
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npx tauri android build --apk

      - name: Build Android AAB (Google Play edition)
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          MINIBEE_PLAY_BUILD: "1"
        run: npx tauri android build --aab

      - name: Verify signed APK and AAB
        if: github.event_name == 'release'
        run: |
          unsigned="${APK_PATH%.apk}-unsigned.apk"
          if [ -f "$unsigned" ] && [ ! -f "$APK_PATH" ]; then
            echo "::error::Build produced an unsigned APK; check signing configuration."
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Signed APK not found at ${APK_PATH}"
            exit 1
          fi
          if [ ! -f "$AAB_PATH" ]; then
            echo "::error::App Bundle not found at ${AAB_PATH}"
            exit 1
          fi
          # An unsigned bundle keeps the same filename, and jarsigner exits 0
          # either way, so check its verdict text.
          if ! jarsigner -verify "$AAB_PATH" | grep -q "jar verified"; then
            echo "::error::App Bundle is not signed; the Play Console will reject it."
            exit 1
          fi

      - name: Find native debug symbols
        id: symbols
        run: |
          SYMBOLS="$(find src-tauri/gen/android/app/build -type f \
            \( -name "native-debug-symbols.zip" -o -name "*native*symbols*.zip" \) \
            -print -quit)"
          if [ -z "$SYMBOLS" ]; then
            echo "::error::Native debug symbols were not generated."
            exit 1
          fi
          echo "Found native debug symbols: $SYMBOLS"
          echo "path=$SYMBOLS" >> "$GITHUB_OUTPUT"

      - name: Upload compile-check artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MiniBee-Viewer-Android-AAB
          path: |
            ${{ env.AAB_PATH }}
            ${{ env.APK_PATH }}
            ${{ steps.symbols.outputs.path }}
          if-no-files-found: error

      - name: Upload APK and AAB to Release
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'release'
        with:
          files: |
            ${{ env.APK_PATH }}
            ${{ env.AAB_PATH }}
            ${{ steps.symbols.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Push the bundle to Google Play through the Play Developer API. Skipped
      # until the GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret exists (the service
      # account's JSON key, invited under Play Console -> Users and permissions
      # with release rights) and always for prereleases. The app's very first
      # bundle has to be uploaded by hand in the Play Console; afterwards every
      # stable release lands on the alpha track, ready to promote. While the
      # Play listing is still a draft, change `status` to `draft`.
      - name: Check for Play upload credentials
        id: play
        if: github.event_name == 'release'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "enabled=$([ -n "$SERVICE_ACCOUNT_JSON" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload AAB to Google Play (alpha track)
        if: github.event_name == 'release' && github.event.release.prerelease == false && steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pantera.minibee_viewer
          releaseFiles: ${{ env.AAB_PATH }}
          tracks: alpha
          status: completed
          releaseName: ${{ github.event.release.tag_name }}
          debugSymbols: ${{ steps.symbols.outputs.path }}

  update-release-notes:
    name: Patch release notes (changelog + downloads + footer)
    needs: [plan, build, build-android]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Insert changelog, download table, and README/LICENSE footer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: node scripts/update-release-notes.mjs --release-id "${RELEASE_ID}"
